<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Coleccionistas - Álbum Virtual</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="header-album">
        <h1>Álbum Virtual - Registro de Coleccionista</h1>
    </header>

    <main class="contenedor-principal">
        
        <section class="seccion-formulario">
            <h2>Creá tu Perfil de Usuario</h2>
            
            <form action="#" method="POST" class="formulario-registro">
                
                <div class="campo-grupo">
                    <label for="usuario">Nombre de Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej: ColeccionistaAlbiceleste">
                </div>

                <div class="campo-grupo">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>

                <div class="campo-grupo">
                    <label for="password">Contraseña (Mínimo 6 caracteres):</label>
                    <input type="password" id="password" name="password" minlength="6" required>
                </div>

                <div class="campo-grupo">
                    <label for="preferencia">Sección favorita para coleccionar:</label>
                    <select id="preferencia" name="preferencia">
                        <option value="arqueros">Arqueros</option>
                        <option value="defensores">Defensores</option>
                        <option value="mediocampistas">Mediocampistas</option>
                        <option value="delanteros">Delanteros</option>
                        <option value="leyendas">Figuritas Legendarias</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensaje">Mensaje para la comunidad (Propuestas de intercambio):</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribí acá qué figuritas buscás o cambiás..."></textarea>
                </div>

                <div class="botones-contenedor">
                    <button type="submit" class="btn-formulario btn-enviar">Enviar Registro</button>
                    <button type="reset" class="btn-formulario btn-restablecer">Restablecer Campos</button>
                </div>

            </form>
        </section>

        <p style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: #439ad4; text-decoration: none; font-weight: bold;">← Volver al Álbum</a>
        </p>

    </main>

</body>
</html>
